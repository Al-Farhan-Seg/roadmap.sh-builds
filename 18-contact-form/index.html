  <body class="m-0 min-h-screen pt-24 font-sans">
    <main
      class="w-min-[45vw] sm:w-max-[55vw] mx-3 rounded-2xl border p-2 sm:m-auto sm:w-[45vw]"
    >
      <h1
        class="fixed top-0 left-0 z-50 m-0 w-full rounded-none bg-black px-4 py-3 text-center text-pink-100"
      >
        Contact Form
      </h1>
      <section>
        <h2 class="text-center font-extrabold">Acme Support</h2>
        <div class="flex justify-around font-semibold">
          <p>Home</p>
          <p>Help</p>
          <p>Contact</p>
        </div>
        <hr />
        <h2 class="text-2xl font-medium">Contact Us</h2>
        <form action="" method="post" class="px-1">
          <legend class="mb-2 text-[16px]">
            Send us a message and we will get back to you.
          </legend>

          <div class="my-2 flex items-center gap-3">
            <label for="full-name-input" class="w-35">Full Name</label>
            <input
              type="text"
              id="full-name-input"
              class="border border-gray-700 w-full md:w-7/10"
            />
          </div>

          <div class="my-2 flex items-center gap-3">
            <label for="email-input" class="w-35">Email</label>
            <input
              type="email"
              id="email-input"
              class="border border-gray-700 w-full md:w-7/10"
            />
          </div>

          <div class="my-2 flex items-center gap-3">
            <label for="subject-choice" class="w-35">Subject</label>
            <select
              name="subject-choice"
              id="subject-choice"
              class="border border-gray-700 w-full md:w-7/10"
            >
              <option value="complaint">Complaint</option>
              <option value="appreciation">Appreciation</option>
              <option value="inquiry">Inquiry</option>
            </select>
          </div>

          <div class="my-2 flex items-start gap-3">
            <label for="detailed-message" class="w-35">Message</label>
            <textarea
              name="detailed-message"
              id="detailed-message"
              class="border border-gray-700 w-full md:w-7/10"
              rows="5"
            ></textarea>
          </div>

          <fieldset>
            <legend>Where did you hear about us?</legend>

            <input type="radio" name="referrer" id="search" />
            <label for="search">Search</label><br />

            <input type="radio" name="referrer" id="friend" />
            <label for="friend">Friend</label><br />

            <input type="radio" name="referrer" id="social-media" />
            <label for="social-media">Social Media</label>
          </fieldset>

          <button type="button" class="m-auto block rounded-sm border p-2 hover:bg-pink-100">
            Send Message
          </button>
        </form>
      </section>
    </main>
    <footer>
      <a
        href="https://roadmap.sh/projects/contact-form"
        class="mx-auto my-16 block w-57.5 rounded-2xl bg-linear-to-br from-stone-950 to-stone-600 p-4 text-center font-semibold text-pink-100 no-underline shadow-xl transition duration-150 ease-in-out hover:shadow-lg hover:brightness-110 active:translate-x-1 active:translate-y-1 active:shadow-none"
        target="_blank"
        rel="noopener noreferrer"
      >
        Go to Project of Reference
      </a>
    </footer>
  </body>
</html>
