<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Age Calculator | Al-Farhan Frontend Projects" />
    <meta
      name="description"
      content="An age calculator built with HTML, CSS, and JavaScript that validates a date of birth and calculates the user's exact age."
    />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://roadmapsh.farhansegujja.com/14-age-calculator/index.html" />
    <meta property="og:title" content="Age Calculator | Al-Farhan Frontend Projects" />
    <meta
      property="og:description"
      content="An age calculator built with HTML, CSS, and JavaScript that validates a date of birth and calculates the user's exact age."
    />
    <meta property="og:image" content="https://roadmapsh.farhansegujja.com/top_assets/favicon-F.png" />
    <meta property="og:image:alt" content="Al-Farhan favicon" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://roadmapsh.farhansegujja.com/14-age-calculator/index.html" />
    <meta name="twitter:title" content="Age Calculator | Al-Farhan Frontend Projects" />
    <meta
      name="twitter:description"
      content="An age calculator built with HTML, CSS, and JavaScript that validates a date of birth and calculates the user's exact age."
    />
    <meta name="twitter:image" content="https://roadmapsh.farhansegujja.com/top_assets/favicon-F.png" />
    <meta name="twitter:image:alt" content="Al-Farhan favicon" />
  </head>
  <body>
    <h1 class="fixed top-0 left-0 z-50 m-0 w-full bg-cyan-800 px-4 py-4 text-center text-3xl font-bold text-cyan-100 shadow-md">
      Age Calculator
    </h1>
    <main class="flex min-h-screen flex-col items-center justify-center gap-4 bg-white p-6 pt-24 text-center font-sans">
      <label for="birthdate" class="text-stone-600 text-2xl">Select your date of birth</label>
      <input
        id="birthdate"
        type="text"
        readonly
        placeholder="Pick a date"
        class="rounded border border-stone-800 px-3 py-2 text-center text-stone-900"
      />
      <p id="result" class="text-lg text-stone-800"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
