<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Showcase</title>
    <link rel="stylesheet" href="../top_assets/tailwind.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../pesticide-adv.cs">
    <link rel="stylesheet" href="../pesticide-ord.cs">
    <link rel="icon" type="image/png" href="../top_assets/favicon-F.png">

    <!-- Primary Meta Tags -->
    <meta name="title" content="Photo Showcase | Al-Farhan Frontend Projects">
    <meta name="description" content="An accessible photo showcase built with semantic HTML and CSS, presenting captioned images and an embedded video using figure and figcaption elements.">

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://roadmapsh.farhansegujja.com/19-photo-showcase/index.html">
    <meta property="og:title" content="Photo Showcase | Al-Farhan Frontend Projects">
    <meta property="og:description" content="An accessible photo showcase built with semantic HTML and CSS, presenting captioned images and an embedded video using figure and figcaption elements.">
    <meta property="og:image" content="https://roadmapsh.farhansegujja.com/top_assets/favicon-F.png">
    <meta property="og:image:alt" content="Al-Farhan favicon">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://roadmapsh.farhansegujja.com/19-photo-showcase/index.html">
    <meta name="twitter:title" content="Photo Showcase | Al-Farhan Frontend Projects">
    <meta name="twitter:description" content="An accessible photo showcase built with semantic HTML and CSS, presenting captioned images and an embedded video using figure and figcaption elements.">
    <meta name="twitter:image" content="https://roadmapsh.farhansegujja.com/top_assets/favicon-F.png">
    <meta name="twitter:image:alt" content="Al-Farhan favicon">
</head>

<body class="m-0 min-h-screen bg-amber-50 pt-24 text-stone-800 font-bold showcase-font">

    <h1 class="fixed top-0 left-0 z-50 m-0 w-full bg-teal-800 px-4 py-4 text-center text-3xl font-bold text-amber-100 shadow-md">
        Photo Showcase
    </h1>

    <main class="mx-auto w-full max-w-6xl px-4 pb-12 sm:px-6 lg:px-8">

        <section class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">

            <figure class="overflow-hidden rounded-xl bg-white p-3 shadow-md">
                <img
                    class="h-auto w-full rounded-lg"
                    src="assets/mountain-lake.jpg"
                    alt="Mountain peaks reflected in a calm lake"
                    width="800"
                    height="600"
                >
                <figcaption class="mt-3 text-sm text-teal-800 text-center">
                    A peaceful mountain lake surrounded by high peaks.
                </figcaption>
            </figure>

            <figure class="overflow-hidden rounded-xl bg-emerald-50 p-3 shadow-md">
                <img
                    class="h-auto w-full rounded-lg"
                    src="assets/forest-path.jpg"
                    alt="Walking path passing through a dense green forest"
                    width="800"
                    height="600"
                >
                <figcaption class="mt-3 text-sm text-emerald-900 text-center">
                    A quiet walking path passing through a green forest.
                </figcaption>
            </figure>

            <figure class="overflow-hidden rounded-xl bg-sky-50 p-3 shadow-md">
                <img
                    class="h-auto w-full rounded-lg"
                    src="assets/coastline.jpg"
                    alt="Rocky coastline beside blue ocean water"
                    width="800"
                    height="600"
                >
                <figcaption class="mt-3 text-sm text-sky-900 text-center">
                    Ocean waves meeting a rugged rocky coastline.
                </figcaption>
            </figure>

            <figure class="overflow-hidden rounded-xl bg-rose-50 p-3 shadow-md">
                <img
                    class="h-auto w-full rounded-lg"
                    src="assets/city-street.jpg"
                    alt="Busy city street lined with tall buildings"
                    width="800"
                    height="600"
                >
                <figcaption class="mt-3 text-sm text-rose-900 text-center">
                    A lively city street surrounded by tall buildings.
                </figcaption>
            </figure>

            <figure class="overflow-hidden rounded-xl bg-orange-50 p-3 shadow-md">
                <img
                    class="h-auto w-full rounded-lg"
                    src="assets/desert.jpg"
                    alt="Sand dunes stretching across a desert landscape"
                    width="800"
                    height="600"
                >
                <figcaption class="mt-3 text-sm text-orange-900 text-center">
                    Warm desert dunes stretching toward the horizon.
                </figcaption>
            </figure>

            <figure class="overflow-hidden rounded-xl bg-violet-50 p-3 shadow-md">
                <img
                    class="h-auto w-full rounded-lg"
                    src="assets/wildflowers.jpg"
                    alt="Field of colorful wildflowers beneath an open sky"
                    width="800"
                    height="600"
                >
                <figcaption class="mt-3 text-sm text-violet-900 text-center">
                    A colorful field of wildflowers under an open sky.
                </figcaption>
            </figure>

        </section>

        <section class="mt-14">
            <h2 class="mb-5 text-2xl font-semibold text-teal-900">
                Decorative Image
            </h2>

            <figure class="overflow-hidden rounded-xl bg-amber-100 p-3 shadow-md">
                <img
                    class="h-auto w-full rounded-lg"
                    src="assets/decorative.jpg"
                    alt=""
                    width="1200"
                    height="400"
                >
                <figcaption class="mt-3 text-sm text-amber-900 text-center">
                    A decorative visual used to add atmosphere to the showcase.
                </figcaption>
            </figure>
        </section>

        <section class="mt-14">
            <h2 class="mb-5 text-2xl font-semibold text-teal-900 text-center">
                Featured Video
            </h2>

            <figure class="max-w-3xl rounded-xl bg-cyan-50 p-3 shadow-md m-auto">

                <video
                    class="h-auto w-full rounded-lg"
                    controls
                    poster="assets/video-poster.jpg"
                >
                    <source
                        class=""
                        src="assets/showcase.mp4"
                        type="video/mp4"
                    >

                    Your browser does not support HTML video.
                </video>

                <figcaption class="mt-3 text-sm text-cyan-900 text-center">
                    A short landscape video complementing the photo collection.
                </figcaption>

            </figure>
        </section>

    </main>


    <a href="https://roadmap.sh/projects/photo-showcase"
        class="mx-auto my-16 block w-57.5 rounded-2xl bg-linear-to-br from-teal-950 to-stone-950 p-4 text-center font-semibold text-amber-100 no-underline shadow-xl transition duration-150 ease-in-out hover:brightness-110 hover:shadow-lg active:translate-x-1 active:translate-y-1 active:shadow-none"
        target="_blank"
        rel="noopener noreferrer">
        Go to Project of Reference
    </a>

</body>
</html>
