<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Showcase</title>
    <link rel="stylesheet" href="../top_assets/tailwind.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../pesticide-adv.cs">
    <link rel="stylesheet" href="../pesticide-ord.cs">
    <link rel="icon" type="image/png" href="../top_assets/favicon-F.png">

    <!-- Primary Meta Tags -->
    <meta name="title" content="Photo Showcase | Al-Farhan Frontend Projects">
    <meta name="description" content="An accessible photo showcase built with semantic HTML and CSS, presenting captioned images and an embedded video using figure and figcaption elements.">

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://roadmapsh.farhansegujja.com/19-photo-showcase/index.html">
    <meta property="og:title" content="Photo Showcase | Al-Farhan Frontend Projects">
    <meta property="og:description" content="An accessible photo showcase built with semantic HTML and CSS, presenting captioned images and an embedded video using figure and figcaption elements.">
    <meta property="og:image" content="https://roadmapsh.farhansegujja.com/top_assets/favicon-F.png">
    <meta property="og:image:alt" content="Al-Farhan favicon">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://roadmapsh.farhansegujja.com/19-photo-showcase/index.html">
    <meta name="twitter:title" content="Photo Showcase | Al-Farhan Frontend Projects">
    <meta name="twitter:description" content="An accessible photo showcase built with semantic HTML and CSS, presenting captioned images and an embedded video using figure and figcaption elements.">
    <meta name="twitter:image" content="https://roadmapsh.farhansegujja.com/top_assets/favicon-F.png">
    <meta name="twitter:image:alt" content="Al-Farhan favicon">
</head>
<body class="m-0 min-h-screen pt-24 font-sans">
    
    <h1 class="fixed top-0 left-0 z-50 m-0 w-full rounded-none bg-white px-4 py-3 text-center text-black">Photo Showcase</h1>
    <main class="mx-auto w-full max-w-6xl px-4 pb-12 sm:px-6 lg:px-8">
        

        <section class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">
            <figure class="min-w-0">
                <img
                    class="h-auto w-full max-w-full"
                    src="images/mountain-lake.jpg"
                    alt="Mountain peaks reflected in a calm lake"
                    width="800"
                    height="600"
                >
                <figcaption class="mt-2">
                    A peaceful mountain lake surrounded by high peaks.
                </figcaption>
            </figure>

            <figure class="min-w-0">
                <img
                    class="h-auto w-full max-w-full"
                    src="images/forest-path.jpg"
                    alt="Walking path passing through a dense green forest"
                    width="800"
                    height="600"
                >
                <figcaption class="mt-2">
                    A quiet path through a green forest.
                </figcaption>
            </figure>

            <figure class="min-w-0">
                <img
                    class="h-auto w-full max-w-full"
                    src="images/coastline.jpg"
                    alt="Rocky coastline beside blue ocean water"
                    width="800"
                    height="600"
                >
                <figcaption class="mt-2">
                    Ocean waves meeting a rocky coastline.
                </figcaption>
            </figure>

            <img
                class="h-auto w-full max-w-full"
                src="images/city-street.jpg"
                alt="Busy city street lined with tall buildings"
                width="800"
                height="600"
            >

            <img
                class="h-auto w-full max-w-full"
                src="images/desert.jpg"
                alt="Sand dunes stretching across a desert landscape"
                width="800"
                height="600"
            >

            <img
                class="h-auto w-full max-w-full"
                src="images/wildflowers.jpg"
                alt="Field of colorful wildflowers beneath an open sky"
                width="800"
                height="600"
            >
        </section>

        <section class="mt-12">
            <h2 class="text-2xl font-semibold">Decorative image</h2>

            <img
                class="mt-4 h-auto w-full max-w-full"
                src="images/decorative.jpg"
                alt=""
                width="1200"
                height="400"
            >
        </section>

        <section class="mt-12">
            <h2 class="text-2xl font-semibold">Featured video</h2>

            <video
                class="mt-4 h-auto w-full max-w-3xl"
                controls
                poster="images/video-poster.jpg"
            >
                <source
                    class=""
                    src="videos/showcase.mp4"
                    type="video/mp4"
                >

                Your browser does not support HTML video.
            </video>
        </section>
    </main>

    <footer class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
        <p class="">
            &copy; 2026 Photo Showcase
        </p>
    </footer>

    <a href="https://roadmap.sh/projects/photo-showcase"
        class="mx-auto my-16 block w-57.5 rounded-2xl bg-linear-to-br from-amber-950 to-stone-950 p-4 text-center font-semibold text-amber-100 no-underline shadow-xl transition duration-150 ease-in-out hover:brightness-110 hover:shadow-lg active:translate-x-1 active:translate-y-1 active:shadow-none"
        target="_blank"
        rel="noopener noreferrer">
        Go to Project of Reference
    </a>
</body>
</html>
